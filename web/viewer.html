<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>阅读 · ReadPI</title>
<link rel="icon" href="/favicon.ico?v=140" sizes="32x32">
<link rel="icon" href="/favicon.svg?v=140" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
<link rel="stylesheet" href="/assets/viewer.css">
<link rel="stylesheet" href="/assets/job-monitor.css">
<link rel="stylesheet" href="/assets/reader-toc.css">
<link rel="stylesheet" href="/assets/reader-ai.css">
<link rel="stylesheet" href="/assets/notes.css">
<link rel="stylesheet" href="/assets/reverse-reading.css">
<script src="/assets/reverse-reading.js"></script>
</head>
<body class="reader">

<div class="r-banner" id="server-banner" hidden>
  <span class="r-banner-dot" aria-hidden="true"></span>
  <span>应用后端还是旧版本，笔记 / 新批注可能无法保存。</span>
  <button type="button" id="banner-restart">重启应用</button>
  <button type="button" class="r-banner-x" id="banner-close" aria-label="关闭">✕</button>
</div>

<header class="r-top">
  <a class="r-back" id="back-link" href="/library">
    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 3.5 5.5 8l4.5 4.5"/>
    </svg>
    <span id="back-label">结果库</span>
  </a>

  <div class="r-doc">
    <strong id="doc-name">加载中…</strong>
    <span id="doc-sub"></span>
  </div>

  <div class="r-tools">
    <div class="r-group r-nav">
      <button class="r-btn" id="btn-prev" type="button" title="上一页（←）">‹</button>
      <input id="page-input" class="r-page" type="number" min="1" value="1" aria-label="页码">
      <span class="r-total" id="page-total">/ 1</span>
      <button class="r-btn" id="btn-next" type="button" title="下一页（→）">›</button>
    </div>

    <div class="r-group">
      <button class="r-btn" id="btn-zoom-out" type="button" title="缩小（-）">−</button>
      <span class="r-zoom" id="zoom-label">100%</span>
      <button class="r-btn" id="btn-zoom-in" type="button" title="放大（+）">+</button>
      <button class="r-btn wide" id="btn-fit" type="button">适应宽度</button>
    </div>

    <div class="r-group">
      <button class="r-btn wide" id="btn-export" type="button" title="导出批注 / 保存带批注的 PDF"
              aria-haspopup="menu" aria-expanded="false">
        导出
        <svg viewBox="0 0 10 10" width="8" height="8" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.4 4 5 6.6 7.6 4"/>
        </svg>
      </button>
    </div>

    <span class="r-saved" id="save-state"></span>

    <button class="r-btn wide r-ai-toggle" id="btn-ai" type="button" aria-pressed="false" title="AI 助读（选中原文右键引用提问）">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 2.6l1.55 4.25L15.8 8.4l-4.25 1.55L10 14.2 8.45 9.95 4.2 8.4l4.25-1.55z"/>
        <path d="M15.4 13.2l.65 1.75 1.75.65-1.75.65-.65 1.75-.65-1.75-1.75-.65 1.75-.65z"/>
      </svg>
      AI 助读
    </button>

    <button class="r-btn wide" id="btn-notes" type="button" aria-pressed="false" title="笔记：悬浮窗口，富文本记录">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 2.8h8.2a1.6 1.6 0 0 1 1.6 1.6v11.2a1.6 1.6 0 0 1-1.6 1.6H5a1.6 1.6 0 0 1-1.6-1.6V4.4A1.6 1.6 0 0 1 5 2.8Z"/>
        <path d="M7.2 7h5.6M7.2 10h5.6M7.2 13h3.4"/>
      </svg>
      笔记
    </button>

    <button class="r-btn r-side-toggle" id="btn-sidebar" type="button" aria-pressed="true" title="显示 / 隐藏侧栏">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/>
        <path d="M6.2 2.8v10.4"/>
      </svg>
    </button>

    <button class="icon-btn r-invert" id="btn-invert" type="button" aria-pressed="false"
            title="反色阅读" aria-label="反色阅读">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"/>
        <path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor" stroke="none"/>
      </svg>
    </button>

    <button class="icon-btn r-theme" id="btn-theme" type="button" title="切换外观" aria-label="切换外观">
      <svg class="ico-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
      </svg>
    </button>
  </div>
</header>

<!-- Controls the dock drives; kept out of the way so the reader stays clean. -->
<div id="reader-controls" hidden aria-hidden="true">
  <select id="paper-theme"><option value="white">原色</option><option value="cream">暖米</option><option value="sage">浅绿</option><option value="blue">雾蓝</option><option value="rose">浅粉</option><option value="ink">水墨屏</option><option value="custom">自定义</option></select>
  <input id="paper-color" type="color" value="#f3ecda">
  <select id="draw-tool"><option value="select">选择 / 移动</option><option value="text">页面文字</option><option value="note">便签</option><option value="pen">自由画</option><option value="line">直线</option><option value="erase">橡皮擦（整笔）</option></select>
  <input id="ink-color" type="color" value="#ff375f">
  <input id="ink-width" type="number" min="0.5" max="30" step="0.5" value="2">
  <input id="ink-opacity" type="range" min="5" max="100" value="100">
  <input id="text-font" type="hidden" value="sans-serif">
  <input id="text-size" type="number" min="8" max="96" value="18">
  <select id="highlight-style"><option value="marker">荧光笔</option><option value="crayon">蜡笔</option><option value="hand">手绘下划线 · 自然</option><option value="hand-soft">手绘下划线 · 轻微</option><option value="hand-strong">手绘下划线 · 明显</option><option value="underline">实线划线</option><option value="pencil">铅笔划线</option><option value="wavy">波浪线</option></select>
  <input type="checkbox" id="color-hints" checked>
  <button id="btn-note-tool" type="button" aria-pressed="false" hidden></button>
</div>

<input type="file" id="font-upload" accept=".ttf,.otf,.ttc,.otc" hidden>

<div class="r-bottom" id="reader-bottom">
  <div class="r-textbar" id="textbar" hidden role="toolbar" aria-label="文字格式">
    <span class="r-textbar-label">文字</span>
    <div class="r-textbar-colors" id="textbar-colors">
      <button class="r-tdot on" type="button" data-text-color="#1d1d1f" style="--c:#1d1d1f" title="黑色" aria-label="黑色"></button>
      <button class="r-tdot" type="button" data-text-color="#0a84ff" style="--c:#0a84ff" title="蓝色" aria-label="蓝色"></button>
      <button class="r-tdot" type="button" data-text-color="#ff375f" style="--c:#ff375f" title="红色" aria-label="红色"></button>
      <button class="r-tdot" type="button" data-text-color="#30b158" style="--c:#30b158" title="绿色" aria-label="绿色"></button>
      <button class="r-tdot" type="button" data-text-color="#ff9f0a" style="--c:#ff9f0a" title="橙色" aria-label="橙色"></button>
      <button class="r-tdot" type="button" data-text-color="#bf5af2" style="--c:#bf5af2" title="紫色" aria-label="紫色"></button>
      <label class="r-tdot r-tdot-custom" title="自定义颜色">
        <input type="color" id="textbar-custom" value="#1d1d1f" aria-label="自定义文字颜色">
      </label>
    </div>
    <span class="r-dock-sep" aria-hidden="true"></span>
    <button class="r-textbar-font" id="textbar-font" type="button" title="选择字体">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.2 16 7.8 4h1.4L14 16M5.2 12h6.6M16.4 16v-5.6M15.1 9.6h2.6"/></svg>
      <span id="textbar-font-name">系统黑体</span>
    </button>
    <span class="r-dock-sep" aria-hidden="true"></span>
    <div class="r-textbar-size">
      <button type="button" data-size="-1" title="减小字号">A−</button>
      <span id="textbar-size">18</span>
      <button type="button" data-size="1" title="增大字号">A+</button>
    </div>
    <span class="r-dock-sep" aria-hidden="true"></span>
    <button class="r-textbar-done" id="textbar-done" type="button">完成</button>
  </div>
  <div class="r-dock" id="reader-dock" role="toolbar" aria-label="阅读与标记工具"></div>
</div>

<div class="r-pop" id="r-pop" role="dialog" aria-modal="false" hidden></div>
<div class="r-main">
  <aside class="r-side" id="sidebar">
    <div class="r-tabs" role="tablist">
      <button class="r-tab on" type="button" data-tab="thumbs">页面</button>
      <button class="r-tab" type="button" data-tab="toc">目录</button>
      <button class="r-tab" type="button" data-tab="notes">批注<span class="r-count" id="anno-count">0</span></button>
    </div>
    <div class="r-panel r-panel-thumbs" id="panel-thumbs"></div>
    <div class="r-panel r-panel-toc" id="panel-toc" hidden></div>
    <div class="r-panel r-panel-notes" id="panel-notes" hidden></div>
    <div class="r-side-resize" id="side-resize" title="拖动调整侧栏宽度" role="separator" aria-orientation="vertical"></div>
    <button class="r-side-handle" id="side-handle" type="button" title="收起侧栏" aria-label="收起侧栏" aria-expanded="true">
      <svg viewBox="0 0 10 16" width="9" height="16" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6.6 3.4 3 8l3.6 4.6"/>
      </svg>
    </button>
  </aside>

  <main class="r-stage" id="stage">
    <button class="r-side-expand" id="side-expand" type="button" title="展开侧栏" aria-label="展开侧栏" hidden>
      <svg viewBox="0 0 10 16" width="9" height="16" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3.4 3.4 7 8l-3.6 4.6"/>
      </svg>
    </button>
    <div class="r-scroll" id="scroll">
      <div class="r-loading" id="loading">
        <span class="r-spinner" aria-hidden="true"></span>正在载入 PDF…
      </div>
      <div class="r-error" id="error" hidden></div>
      <div class="r-pages" id="pages" hidden></div>
    </div>
  </main>

  <aside class="r-ai" id="ai-drawer" hidden aria-label="AI 助读">
    <div class="r-ai-resize" id="ai-resize" role="separator" aria-orientation="vertical"
         title="拖动调整 AI 面板宽度"></div>
    <header class="r-ai-head">
      <span class="r-ai-title">AI 助读</span>
      <span class="r-ai-provider" id="ai-provider-pill">检测中…</span>
      <button class="r-ai-iconbtn" id="ai-settings-btn" type="button" title="模型设置" aria-label="模型设置">⚙</button>
      <button class="r-ai-iconbtn" id="ai-close" type="button" title="关闭" aria-label="关闭">✕</button>
    </header>
    <div class="r-ai-body" id="ai-messages"></div>
    <div class="r-ai-quote" id="ai-quote" hidden>
      <span class="r-ai-quote-tag" id="ai-quote-tag"></span>
      <p class="r-ai-quote-text" id="ai-quote-text"></p>
      <button class="r-ai-quote-x" type="button" data-ai-quote-clear title="移除引用" aria-label="移除引用">✕</button>
    </div>
    <div class="r-ai-suggest" id="ai-suggest"></div>
    <form class="r-ai-compose" id="ai-form">
      <div class="r-ai-box" data-ai-box>
        <div class="r-ai-attach-list" id="ai-attachments" hidden></div>
        <textarea id="ai-input" rows="1" placeholder="向 AI 提问，或上传图片…" spellcheck="false"></textarea>
        <div class="r-ai-compose-foot">
          <button type="button" class="r-ai-attach" id="ai-attach" title="上传图片（也可以拖拽或粘贴）" aria-label="上传图片">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <input type="file" id="ai-image-file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
          <button type="button" class="r-ai-model" id="ai-model-btn" title="选择模型">模型：自动</button>
          <span class="r-ai-compose-spacer"></span>
          <span class="r-ai-compose-hint" id="ai-compose-hint">Enter 发送 · Shift+Enter 换行</span>
          <button type="submit" class="r-ai-send" id="ai-send" title="发送" aria-label="发送">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>
            </svg>
          </button>
        </div>
      </div>
    </form>
    <div class="r-ai-settings" id="ai-settings" hidden></div>
  </aside>

</div>

<aside class="r-notes" id="notes-drawer" hidden aria-label="笔记"></aside>

<div class="r-sel" id="sel-toolbar" hidden>
  <div class="r-sel-colors" id="sel-colors" aria-label="颜色标签"></div>
  <span class="r-vsep"></span>
  <div class="r-sel-style" id="sel-styles" role="group" aria-label="标记样式"></div>
  <span class="r-vsep"></span>
  <button class="r-sel-action" id="sel-ai" type="button">AI 提问</button>
  <button class="r-sel-action" id="sel-notebook" type="button">存笔记</button>
  <button class="r-sel-action" id="sel-note" type="button">写批注</button>
  <button class="r-sel-action" id="sel-copy" type="button">复制</button>
</div>
<!-- Opened by the toolbar's "+" dot: pick a colour and it becomes a new tag,
     then the selection is highlighted with it without a trip to the dock. -->
<input class="r-color-native" id="sel-color-picker" type="color" value="#3aa0ff"
       tabindex="-1" aria-hidden="true">

<div class="r-editor" id="editor" hidden>
  <div class="r-editor-top">
    <span class="r-editor-page" id="editor-page"></span>
    <div class="r-colors" id="editor-colors" aria-label="颜色标签"></div>
    <button class="r-editor-close" id="editor-close" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="r-editor-styles" id="editor-styles" role="group" aria-label="标记样式" hidden></div>
  <p class="r-quote" id="editor-quote" hidden></p>
  <textarea id="editor-text" rows="4" placeholder="写下批注…" spellcheck="false"></textarea>
  <div class="r-editor-foot">
    <button class="r-danger" id="editor-delete" type="button">删除</button>
    <button class="btn btn-primary small" id="editor-done" type="button">完成</button>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<div class="r-tip" id="tip" hidden></div>
<div class="r-menu" id="menu" hidden></div>

<script src="/assets/pdfjs/build/pdf.min.js"></script>
<script src="/assets/shared.js"></script>
<script src="/assets/job-monitor.js"></script>
<script src="/assets/hand-underline.js"></script>
<script src="/assets/viewer.js"></script>
<script src="/assets/reader-toc.js"></script>
<script src="/assets/reader-ai.js"></script>
<script src="/assets/notes.js"></script>
</body>
</html>
