<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>阅读 · BabelDOC Studio</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
<link rel="stylesheet" href="/assets/viewer.css">
</head>
<body class="reader">

<header class="r-top">
  <a class="r-back" id="back-link" href="/library">
    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 3.5 5.5 8l4.5 4.5"/>
    </svg>
    <span id="back-label">结果库</span>
  </a>

  <div class="r-doc">
    <strong id="doc-name">加载中…</strong>
    <span id="doc-sub"></span>
  </div>

  <div class="r-tools">
    <div class="r-group">
      <button class="r-btn" id="btn-prev" type="button" title="上一页（←）">‹</button>
      <input id="page-input" class="r-page" type="number" min="1" value="1" aria-label="页码">
      <span class="r-total" id="page-total">/ 1</span>
      <button class="r-btn" id="btn-next" type="button" title="下一页（→）">›</button>
    </div>

    <div class="r-group">
      <button class="r-btn" id="btn-zoom-out" type="button" title="缩小（-）">−</button>
      <span class="r-zoom" id="zoom-label">100%</span>
      <button class="r-btn" id="btn-zoom-in" type="button" title="放大（+）">+</button>
      <button class="r-btn wide" id="btn-fit" type="button">适应宽度</button>
    </div>

    <div class="r-group">
      <button class="r-btn wide" id="btn-note-tool" type="button" aria-pressed="false" title="在页面上添加便签">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11.5 2.5 13.5 4.5 5 13H3v-2z"/>
        </svg>
        批注
      </button>
      <button class="r-btn wide" id="btn-export" type="button" title="导出批注 / 保存带批注的 PDF"
              aria-haspopup="menu" aria-expanded="false">
        导出
        <svg viewBox="0 0 10 10" width="8" height="8" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.4 4 5 6.6 7.6 4"/>
        </svg>
      </button>
    </div>

    <span class="r-saved" id="save-state"></span>

    <button class="r-btn r-side-toggle" id="btn-sidebar" type="button" aria-pressed="true" title="显示 / 隐藏侧栏">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/>
        <path d="M6.2 2.8v10.4"/>
      </svg>
    </button>

    <button class="icon-btn r-theme" id="btn-theme" type="button" title="切换外观" aria-label="切换外观">
      <svg class="ico-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
      <svg class="ico-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
      </svg>
    </button>
  </div>
</header>

<!-- Controls the dock drives; kept out of the way so the reader stays clean. -->
<div id="reader-controls" hidden aria-hidden="true">
  <select id="paper-theme"><option value="white">原色</option><option value="cream">暖米</option><option value="sage">浅绿</option><option value="blue">雾蓝</option><option value="rose">浅粉</option><option value="ink">水墨屏</option><option value="custom">自定义</option></select>
  <input id="paper-color" type="color" value="#f3ecda">
  <select id="draw-tool"><option value="select">选择 / 移动</option><option value="text">页面文字</option><option value="note">便签</option><option value="pen">自由画</option><option value="line">直线</option><option value="erase">橡皮擦（整笔）</option></select>
  <input id="ink-color" type="color" value="#30343b">
  <input id="ink-width" type="number" min="0.5" max="30" step="0.5" value="2">
  <input id="ink-opacity" type="range" min="5" max="100" value="100">
  <select id="text-font"><option>sans-serif</option><option>serif</option><option>monospace</option></select>
  <input id="text-size" type="number" min="8" max="96" value="18">
  <select id="highlight-style"><option value="marker">荧光笔</option><option value="underline">实线划线</option><option value="pencil">铅笔划线</option></select>
  <input type="checkbox" id="color-hints" checked>
</div>

<div class="r-dock" id="reader-dock" role="toolbar" aria-label="阅读与标记工具">
  <div class="r-dock-group">
    <button class="r-dock-btn" type="button" data-tool="select" title="选择 / 移动（V）" aria-label="选择 / 移动" aria-pressed="true">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.2 3.2v12.1l3.1-3 2 4.5 2.3-1-2-4.4h4.2z"/></svg>
    </button>
    <button class="r-dock-btn" type="button" data-tool="text" title="页面文字（T）" aria-label="页面文字" aria-pressed="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 5V3.8h12V5M10 3.8v12.4M7.6 16.2h4.8"/></svg>
    </button>
    <button class="r-dock-btn" type="button" data-tool="note" title="便签（N）" aria-label="便签" aria-pressed="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3.6h12v8.6l-4 4H4z"/><path d="M16 12.2h-4v4"/></svg>
    </button>
    <button class="r-dock-btn" type="button" data-tool="pen" title="自由画（P）" aria-label="自由画" aria-pressed="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 3.6 16.4 6.6 7.6 15.4l-4 1 1-4z"/><path d="m11.8 5.2 3 3"/></svg>
    </button>
    <button class="r-dock-btn" type="button" data-tool="line" title="直线（L）" aria-label="直线" aria-pressed="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 16 16 4"/><circle cx="4" cy="16" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="4" r="1.3" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="r-dock-btn" type="button" data-tool="erase" title="橡皮擦：整笔删除（E）" aria-label="橡皮擦" aria-pressed="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8.4 15.6-4.6-4.6a1.6 1.6 0 0 1 0-2.3l5.1-5.1a1.6 1.6 0 0 1 2.3 0l4.1 4.1a1.6 1.6 0 0 1 0 2.3l-5.6 5.6z"/><path d="M6.2 7.4 12.8 14M4.4 16.4h11.2"/></svg>
    </button>
  </div>

  <span class="r-dock-sep" aria-hidden="true"></span>

  <div class="r-dock-group" id="dock-styles" role="group" aria-label="标记样式">
    <button class="r-dock-btn" type="button" data-style="marker" title="荧光笔" aria-label="荧光笔" aria-pressed="true">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 3.4 16.6 7.4 9 15h-4v-4z"/><path d="m10.8 5.2 4 4M4 16.6h12"/><path d="M15.6 8.4 18 10.8" opacity=".55"/></svg>
    </button>
    <button class="r-dock-btn" type="button" data-style="underline" title="实线划线" aria-label="实线划线" aria-pressed="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6.6h12M4 10.2h8M4 15.4h12"/></svg>
    </button>
    <button class="r-dock-btn" type="button" data-style="pencil" title="铅笔划线" aria-label="铅笔划线" aria-pressed="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2.4 2.2" aria-hidden="true"><path d="M4 15.4h12"/><path d="M4 9.4c2.2-1.8 4.4 1.8 6.6 0s4.4 1.8 5.4.6" stroke-dasharray="0"/></svg>
    </button>
  </div>

  <span class="r-dock-sep" aria-hidden="true"></span>

  <button class="r-dock-btn r-dock-swatch" id="dock-ink" type="button" title="墨色、粗细与不透明度" aria-label="墨色、粗细与不透明度" aria-haspopup="dialog" aria-expanded="false">
    <span class="r-dock-dot" id="dock-ink-dot"></span>
  </button>
  <button class="r-dock-btn" id="dock-text" type="button" title="字体与字号" aria-label="字体与字号" aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.2 16 7.8 4h1.4L14 16M5.2 12h6.6M16.4 16v-5.6M15.1 9.6h2.6"/></svg>
  </button>
  <button class="r-dock-btn" id="dock-paper" type="button" title="纸面颜色" aria-label="纸面颜色" aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2.8" width="12" height="14.4" rx="1.8"/><path d="M7.2 6.4h5.6M7.2 9.2h5.6M7.2 12h3.4"/></svg>
  </button>
  <button class="r-dock-btn" id="toggle-original" type="button" title="隐藏左侧原文（适用于左右对照 PDF）" aria-label="隐藏左侧原文" aria-pressed="true">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.6" y="3.6" width="14.8" height="12.8" rx="2"/><path d="M10 3.6v12.8M17.4 6.2h-2.8M17.4 10h-2.8M17.4 13.8h-2.8"/></svg>
  </button>
  <button class="r-dock-btn" id="dock-legend" type="button" title="颜色标签" aria-label="颜色标签" aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.8a7.2 7.2 0 1 0 0 14.4c1 0 1.4-.7 1.4-1.4 0-1.6 1-2.2 2.2-2.2h1.2A2.4 2.4 0 0 0 17.2 11 7.4 7.4 0 0 0 10 2.8Z"/><circle cx="6.4" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="9.6" cy="5.8" r="1" fill="currentColor" stroke="none"/><circle cx="13.2" cy="7" r="1" fill="currentColor" stroke="none"/></svg>
  </button>
</div>

<div class="r-pop" id="r-pop" role="dialog" aria-modal="false" hidden></div>
<div class="r-main">
  <aside class="r-side" id="sidebar">
    <div class="r-tabs">
      <button class="r-tab on" type="button" data-tab="thumbs">页面</button>
      <button class="r-tab" type="button" data-tab="notes">批注<span class="r-count" id="anno-count">0</span></button>
    </div>
    <div class="r-panel r-panel-thumbs" id="panel-thumbs"></div>
    <div class="r-panel r-panel-notes" id="panel-notes" hidden></div>
  </aside>

  <main class="r-stage" id="stage">
    <div class="r-scroll" id="scroll">
      <div class="r-loading" id="loading">
        <span class="r-spinner" aria-hidden="true"></span>正在载入 PDF…
      </div>
      <div class="r-error" id="error" hidden></div>
      <div class="r-pages" id="pages" hidden></div>
    </div>
  </main>
</div>

<div class="r-sel" id="sel-toolbar" hidden>
  <button class="r-dot yellow" type="button" data-color="yellow" title="黄色高亮"></button>
  <button class="r-dot green" type="button" data-color="green" title="绿色高亮"></button>
  <button class="r-dot blue" type="button" data-color="blue" title="蓝色高亮"></button>
  <button class="r-dot pink" type="button" data-color="pink" title="粉色高亮"></button>
  <button class="r-dot orange" type="button" data-color="orange" title="橙色高亮"></button>
  <button class="r-dot purple" type="button" data-color="purple" title="紫色高亮"></button>
  <button class="r-dot teal" type="button" data-color="teal" title="青色高亮"></button>
  <button class="r-dot red" type="button" data-color="red" title="红色高亮"></button>
  <span class="r-vsep"></span>
  <div class="r-sel-style" id="sel-styles" role="group" aria-label="标记样式">
    <button class="r-style-btn" type="button" data-style="marker" title="荧光笔" aria-label="荧光笔" aria-pressed="true">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 3.4 16.6 7.4 9 15h-4v-4z"/><path d="m10.8 5.2 4 4M4 16.6h12"/></svg>
    </button>
    <button class="r-style-btn" type="button" data-style="underline" title="实线划线" aria-label="实线划线" aria-pressed="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6.6h12M4 10.2h8M4 15.4h12"/></svg>
    </button>
    <button class="r-style-btn" type="button" data-style="pencil" title="铅笔划线" aria-label="铅笔划线" aria-pressed="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 15.4h12"/><path d="M4 9.4c2.2-1.8 4.4 1.8 6.6 0s4.4 1.8 5.4.6"/></svg>
    </button>
  </div>
  <span class="r-vsep"></span>
  <button class="r-sel-action" id="sel-note" type="button">写批注</button>
  <button class="r-sel-action" id="sel-copy" type="button">复制</button>
</div>

<div class="r-editor" id="editor" hidden>
  <div class="r-editor-top">
    <span class="r-editor-page" id="editor-page"></span>
    <div class="r-colors" id="editor-colors">
      <button class="r-dot yellow" type="button" data-color="yellow" title="黄色"></button>
      <button class="r-dot green" type="button" data-color="green" title="绿色"></button>
      <button class="r-dot blue" type="button" data-color="blue" title="蓝色"></button>
      <button class="r-dot pink" type="button" data-color="pink" title="粉色"></button>
      <button class="r-dot orange" type="button" data-color="orange" title="橙色"></button>
      <button class="r-dot purple" type="button" data-color="purple" title="紫色"></button>
      <button class="r-dot teal" type="button" data-color="teal" title="青色"></button>
      <button class="r-dot red" type="button" data-color="red" title="红色"></button>
    </div>
    <button class="r-editor-close" id="editor-close" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="r-editor-styles" id="editor-styles" role="group" aria-label="标记样式" hidden>
    <span class="r-editor-style-label">样式</span>
    <button class="r-style-btn" type="button" data-style="marker" title="荧光笔" aria-label="荧光笔" aria-pressed="true">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 3.4 16.6 7.4 9 15h-4v-4z"/><path d="m10.8 5.2 4 4M4 16.6h12"/></svg>
    </button>
    <button class="r-style-btn" type="button" data-style="underline" title="实线划线" aria-label="实线划线" aria-pressed="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6.6h12M4 10.2h8M4 15.4h12"/></svg>
    </button>
    <button class="r-style-btn" type="button" data-style="pencil" title="铅笔划线" aria-label="铅笔划线" aria-pressed="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 15.4h12"/><path d="M4 9.4c2.2-1.8 4.4 1.8 6.6 0s4.4 1.8 5.4.6"/></svg>
    </button>
  </div>
  <p class="r-quote" id="editor-quote" hidden></p>
  <textarea id="editor-text" rows="4" placeholder="写下批注…" spellcheck="false"></textarea>
  <div class="r-editor-foot">
    <button class="r-danger" id="editor-delete" type="button">删除</button>
    <button class="btn btn-primary small" id="editor-done" type="button">完成</button>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<div class="r-tip" id="tip" hidden></div>
<div class="r-menu" id="menu" hidden></div>

<script src="/assets/pdfjs/build/pdf.min.js"></script>
<script src="/assets/shared.js"></script>
<script src="/assets/viewer.js"></script>
</body>
</html>
