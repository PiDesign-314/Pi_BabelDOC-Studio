name: Windows portable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-portable.txt pytest pillow
      - run: python -m pytest -q
      - run: python tools/make_icon.py
      - run: python tools/build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: BabelDOC-Studio-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.sha256' }
          gh release create "$env:GITHUB_REF_NAME" $assets.FullName --draft --generate-notes
